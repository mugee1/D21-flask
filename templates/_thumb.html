{# 클래스 썸네일 조각: 이미지가 있으면 사진, 없으면 "카테고리 색 + 아이콘"으로 보여줘요 #}
{# 회색 빈 박스는 오류처럼 보여서, 일부러 꾸민 표지처럼 보이게 했어요 #}
{% set icons = {
  "공예":   '<circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4 8.12 15.88M14.47 14.48 20 20M8.12 8.12 12 12"/>',
  "드로잉": '<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
  "디지털": '<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M2 20h20"/>',
  "요리":   '<path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/>',
  "운동":   '<path d="M6 5v14M18 5v14M3 9v6M21 9v6M6 12h12"/>',
  "음악":   '<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',
} %}
{% if c.image %}                          {# 나중에 이미지 칸이 생기면 사진을 먼저 보여줘요 #}
  <img class="thumb" src="{{ c.image }}" alt="" loading="lazy">
{% else %}                                {# 이미지가 없으면 카테고리 표지 #}
  <div class="thumb thumb-cover" data-cat="{{ c.category }}" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      {{ (icons.get(c.category) or '<path d="M12 3l1.9 5.6L19.5 10l-5.6 1.9L12 17.5l-1.9-5.6L4.5 10l5.6-1.4Z"/>') | safe }}   {# 모르는 카테고리는 반짝이 아이콘 #}
    </svg>
  </div>
{% endif %}
